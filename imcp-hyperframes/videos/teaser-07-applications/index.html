<!doctype html>
<html lang="fr" data-resolution="portrait">

    <style>
      /* Polices auto-hebergees — doctrine IMCP (src/theme/client-01.ts).
         Embarquees en base64 : aucun fichier externe, aucune dependance
         reseau au rendu (headless Chromium sur VPS n'a PAS internet garanti
         et n'a AUCUNE des polices Google installees comme polices systeme —
         verifie le 31/07/2026, fc-list ne remontait que DejaVu/FreeSans/Noto).
         Sans ceci, le rendu retombe sur une police de secours generique,
         silencieusement, sans erreur — d'ou l'ecart local/VPS constate. */
      @font-face {
        font-family: 'Cormorant';
        font-style: normal;
        font-weight: 500 700;
        font-display: swap;
        src: url(./fonts/cormorant-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Cormorant';
        font-style: italic;
        font-weight: 500 700;
        font-display: swap;
        src: url(./fonts/cormorant-italic.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(./fonts/manrope-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(./fonts/jetbrains-mono-normal.woff2) format('woff2');
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #060d18; }
      body { font-family: Manrope, sans-serif; }
      :root { --bg:#060d18; --fluo:#5fe8ff; --ivory:#eef3fa; --slate:#9db1c9; --champagne:#49b6c9; }
      .fill { position:absolute; inset:0; }
      #bg { width:100%; height:100%; object-fit:cover; filter:blur(48px) brightness(0.34) saturate(1.1); transform:scale(1.5); }
      #bg-tint { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 30%, rgba(95,232,255,0.10), rgba(6, 13, 24,0.6) 70%); }
      #screen-wrap { position:absolute; left:48px; right:48px; top:214px; height:558px; border-radius:26px; overflow:hidden;
        border:2px solid rgba(95,232,255,0.55); box-shadow:0 30px 90px rgba(0,0,0,0.6),0 0 60px rgba(95,232,255,0.12); background:#000; }
      #screen { width:100%; height:100%; object-fit:contain; transform-origin:50% 50%; will-change:transform; }
      #screen-glow { position:absolute; inset:-80px; z-index:-1; opacity:0.5; background:radial-gradient(closest-side, rgba(95,232,255,0.4), rgba(95,232,255,0) 72%); }
      #topbar { position:absolute; left:48px; right:48px; top:74px; display:flex; align-items:center; justify-content:space-between; }
      #topbar .brand { font-size:34px; font-weight:800; letter-spacing:0.18em; color:var(--fluo); }
      #topbar .mod { font-size:20px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--slate); padding:8px 18px; border-radius:100px; border:1px solid rgba(143,163,184,0.35); }
      .slot { position:absolute; left:60px; right:60px; top:830px; }
      .wrap { position:relative; }
      .glow { position:absolute; inset:-120px; z-index:1; opacity:0; background:radial-gradient(closest-side, rgba(95,232,255,0.55) 0%, rgba(95,232,255,0.18) 52%, rgba(95,232,255,0) 78%); }
      .card { position:relative; z-index:2; overflow:hidden; padding:38px 44px 42px; text-align:center; background:rgba(6, 13, 24,0.92); border:1.5px solid rgba(95,232,255,0.5); border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,0.55); }
      .kicker { font-size:22px; font-weight:800; letter-spacing:0.22em; text-transform:uppercase; color:var(--champagne); margin-bottom:20px; }
      .big { font-family: "Cormorant", serif; font-size:72px; line-height:1.05; color:var(--ivory); }
      .big .kw { color:var(--fluo); }
      .three { display:flex; flex-direction:column; gap:10px; }
      .three .l { font-size:44px; font-weight:800; color:var(--slate); line-height:1.12; }
      .three .l.on { color:var(--fluo); }
      .sweep { position:absolute; top:0; bottom:0; left:0; width:240px; z-index:3; pointer-events:none; background:linear-gradient(105deg, rgba(95,232,255,0) 0%, rgba(95,232,255,0.18) 50%, rgba(95,232,255,0) 100%); }
      #subs { position:absolute; left:70px; right:70px; bottom:150px; display:flex; justify-content:center; }
      #subs .pill b { color: var(--fluo); font-weight: 700; text-shadow: 0 0 16px rgba(95,232,255,0.8), 0 0 5px rgba(95,232,255,0.6); }
      #subs .pill { padding:20px 32px; border-radius:18px; background:rgba(2,7,13,0.86); border:1px solid rgba(143,163,184,0.28); font-size:38px; font-weight:600; line-height:1.26; color:var(--ivory); text-align:center; }
      #end { display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); text-align:center; }
      #end .stack { position:relative; display:inline-block; }
      #end-glow { position:absolute; inset:-190px; z-index:1; opacity:0; background:radial-gradient(closest-side, rgba(95,232,255,0.55), rgba(95,232,255,0.18) 54%, rgba(95,232,255,0) 78%); }
      #end img { position:relative; z-index:2; width:320px; display:block; }
      #end .t { font-family: "Cormorant", serif; font-size:58px; color:var(--ivory); margin-top:34px; line-height:1.1; }
      #end .u { font-family:"JetBrains Mono", monospace; font-size:36px; color:var(--fluo); margin-top:26px; }
      #end .caret { display:inline-block; width:15px; height:36px; background:var(--fluo); vertical-align:-6px; margin-left:3px; }
      svg { display:block; }
    </style>
  </head>
  <body>
    <!-- Teaser généré depuis le template validé (cours 1). Letterbox 16:9,
         source floutée en fond, cartons + sous-titres autour. Muet côté cartons,
         voix conservée sur le cadre. Doctrine de montage appliquée. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="65.4"
         data-width="1080" data-height="1920" data-fps="30">
      <video id="bg" class="clip fill" src="teaser-src.mp4" muted playsinline
             data-start="0" data-duration="61.4" data-media-start="0" data-track-index="0"></video>
      <div id="bg-tint" class="clip fill" data-start="0" data-duration="61.4" data-track-index="6" style="z-index:1"></div>
      <div id="screen-wrap" class="clip" data-start="0" data-duration="61.4" data-track-index="1">
        <div id="screen-glow"></div>
        <video id="screen" src="teaser-src.mp4" playsinline data-has-audio="true"
               data-start="0" data-duration="61.4" data-media-start="0"></video>
      </div>
      <div id="topbar" class="clip" data-start="0" data-duration="61.4" data-track-index="2">
        <span class="brand">IMCP</span><span class="mod">Module 7 · Applications cliniques</span>
      </div>
      <div id="k1" class="slot clip" data-start="0.5" data-duration="8.5" data-track-index="3">
        <div class="wrap"><div class="glow" data-layout-allow-overflow></div>
          <div class="card"><div class="kicker">La comparaison</div><div class="big">Lame froide<br />contre <span class='kw'>LASER Er-YAG</span></div><div class="sweep" data-layout-allow-overflow></div></div>
        </div>
      </div>
      <div id="k2" class="slot clip" data-start="18.4" data-duration="9.0" data-track-index="3">
        <div class="wrap"><div class="glow" data-layout-allow-overflow></div>
          <div class="card"><div class="kicker">La lame froide</div><div class="big">Ça saigne,<br />on ne voit <span class='kw'>plus rien</span></div><div class="sweep" data-layout-allow-overflow></div></div>
        </div>
      </div>
      <div id="k3" class="slot clip" data-start="40.5" data-duration="9.5" data-track-index="3">
        <div class="wrap"><div class="glow" data-layout-allow-overflow></div>
          <div class="card"><div class="kicker">Le laser</div><div class="big">Champ dégagé,<br />chaque <span class='kw'>couche visible</span></div><div class="sweep" data-layout-allow-overflow></div></div>
        </div>
      </div>

      <div id="subs" class="clip" data-start="0" data-duration="61.4" data-track-index="4">
        <div class="pill" id="sub-pill"></div>
      </div>
      <div id="end" class="clip fill" data-start="61.4" data-duration="4" data-track-index="5">
        <div class="stack"><div id="end-glow" data-layout-allow-overflow></div><img src="logo-mark.png" alt="IMCP" /></div>
        <div class="t">Applications<br />en microchirurgie</div>
        <div class="u"><span id="typed"></span><span class="caret" id="caret"></span></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const VID = 61.4;

      const cam = { p: 0 };
      tl.fromTo(cam, { p: 0 }, { p: 1, duration: VID, ease: "none", onUpdate: () => {
        const el = document.querySelector("#screen"); if (!el) return;
        const p = cam.p; const s = 1.02 + p * 0.06; const dy = Math.sin(p * Math.PI * 2) * 4;
        el.style.transform = `translateY(${dy}px) scale(${s})`; } }, 0);

      const CUES = [{s:0.02,e:1.88,t:"Et là, vous avez sur la vidéo une",h:"Et là, vous avez sur la vidéo une"},{s:1.88,e:6.88,t:"comparaison entre la lame froide et le laser.",h:"comparaison entre la lame froide et le <b>laser</b>."},{s:6.9,e:9.34,t:"Alors vous voyez la dissection multicouche.",h:"Alors vous voyez la dissection multicouche."},{s:9.36,e:11.22,t:"On peut la faire avec",h:"On peut la faire avec"},{s:11.22,e:12.98,t:"des lames froides, bien entendu.",h:"des lames froides, bien entendu."},{s:13.26,e:15.26,t:"Et vous allez voir l'intérêt",h:"Et vous allez voir l'intérêt"},{s:15.26,e:17.84,t:"de la faire avec le laser Er-YAG.",h:"de la faire avec le laser <b>Er-YAG</b>."},{s:17.96,e:19.2,t:"Vous voyez qu'avec la lame",h:"Vous voyez qu'avec la lame"},{s:19.2,e:21.76,t:"froide, on a des saignements importants.",h:"froide, on a des saignements importants."},{s:21.76,e:23.58,t:"Alors que là, regardez, avec le",h:"Alors que là, regardez, avec le"},{s:23.58,e:26.3,t:"laser, on opère très, très finement.",h:"<b>laser</b>, on opère très, très finement."},{s:26.74,e:28.56,t:"Et notre champ opératoire",h:"Et notre champ opératoire"},{s:28.56,e:32.02,t:"est parfaitement dégagé du sang.",h:"est parfaitement dégagé du sang."},{s:32.08,e:34.24,t:"Parce qu'il y a un spray qui",h:"Parce qu'il y a un spray qui"},{s:34.24,e:36.74,t:"permet d'évacuer au fur et à mesure.",h:"permet d'évacuer au fur et à mesure."},{s:36.74,e:40.16,t:"Donc on arrive à identifier les",h:"Donc on arrive à identifier les"},{s:40.16,e:43.28,t:"couches opérées, les différentes entités à opérer.",h:"couches opérées, les différentes entités à opérer."},{s:43.38,e:45.14,t:"Et là, en l'occurrence, vous reconnaissez",h:"Et là, en l'occurrence, vous reconnaissez"},{s:45.14,e:46.16,t:"la vidéo de tout à l'heure,",h:"la vidéo de tout à l'heure,"},{s:46.28,e:49.0,t:"on a réussi à dissocier en",h:"on a réussi à dissocier en"},{s:49.0,e:53.14,t:"épaisseur partielle le périoste des structures superficielles,",h:"épaisseur partielle le périoste des structures superficielles,"},{s:53.2,e:55.7,t:"c'est-à-dire les muscles et la gencive libre.",h:"c'est-à-dire les muscles et la <b>gencive</b> libre."},{s:55.9,e:57.96,t:"Donc on opère avec le laser",h:"Donc on opère avec le <b>laser</b>"},{s:57.96,e:60.98,t:"Er-YAG de manière raisonnée et sans tension.",h:"<b>Er-YAG</b> de manière raisonnée et sans tension."}];
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: VID, duration: VID, ease: "none", onUpdate: () => {
        const pill = document.querySelector("#sub-pill"); if (!pill) return;
        const now = st.t; let a = null;
        for (let i = 0; i < CUES.length; i++) { if (now >= CUES[i].s && now < CUES[i].e) { a = CUES[i]; break; } }
        if (a && now < VID - 1) { pill.innerHTML = a.h; pill.style.opacity = "1"; } else { pill.textContent = ""; pill.style.opacity = "0"; } } }, 0);

      const G_PEAK = 0.38, G_AMP = 0.04;
      const K = [{id:"#k1",at:0.5,dur:8.5,cyc:1},{id:"#k2",at:18.4,dur:9.0,cyc:1},{id:"#k3",at:40.5,dur:9.5,cyc:2}];
      const SW_A = -280, SW_B = 1000;
      K.forEach(function (c) {
        const box = c.id + " .card", g = c.id + " .glow", BLOOM = 0.45, OUT = c.at + c.dur - 0.35;
        tl.fromTo(box, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, c.at);
        if (document.querySelectorAll(c.id + " .l").length) {
          tl.fromTo(c.id + " .l", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.28 }, c.at + 0.3);
        }
        tl.fromTo(g, { opacity: 0, scale: 0.86 }, { opacity: G_PEAK, scale: 1, duration: BLOOM, ease: "power2.out" }, c.at);
        const ph = { v: 0 };
        tl.to(ph, { v: Math.PI * 2 * c.cyc, duration: Math.max(0.1, c.dur - BLOOM - 0.35), ease: "none", onUpdate: () => {
          const el = document.querySelector(g); if (!el) return; const k = Math.sin(ph.v);
          el.style.opacity = String(G_PEAK + k * G_AMP); el.style.transform = `scale(${1 + k * 0.022})`; } }, c.at + BLOOM);
        tl.fromTo(c.id + " .sweep", { x: SW_A }, { x: SW_B, duration: 1.2, ease: "none" }, c.at + 0.4);
        tl.set(c.id + " .sweep", { x: SW_A }, c.at + c.dur);
        tl.to(box, { opacity: 0, duration: 0.35 }, OUT);
        tl.to(g, { opacity: 0, duration: 0.35 }, OUT);
        tl.set(box, { opacity: 0 }, c.at + c.dur);
        tl.set(g, { opacity: 0 }, c.at + c.dur);
      });

      tl.fromTo("#end-glow", { opacity: 0, scale: 0.88 }, { opacity: 0.28, scale: 1, duration: 0.7, ease: "power2.out" }, VID + 0.2);
      tl.fromTo("#end img", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, VID + 0.2);
      tl.fromTo("#end .t", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, VID + 0.45);
      tl.fromTo("#end .u", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, VID + 0.8);
      const URL = "imcpformations.fr", LEAD = 0.05, SPAN = 0.5; const ty = { p: 0 };
      tl.fromTo(ty, { p: 0 }, { p: 1, duration: 3.1, ease: "none", onUpdate: () => {
        const el = document.querySelector("#typed"); if (!el) return;
        const k = Math.min(1, Math.max(0, (ty.p - LEAD) / SPAN)); el.textContent = URL.slice(0, Math.round(k * URL.length)); } }, VID + 0.9);
      const car = { v: 0 };
      tl.to(car, { v: 6, duration: 3.0, ease: "none", onUpdate: () => {
        const el = document.querySelector("#caret"); if (el) el.style.opacity = (car.v % 1) < 0.5 ? "1" : "0.12"; } }, VID + 0.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
