<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Polices du socle — copiees par npm run socle:sync (decision 016). */
      @font-face { font-family:'Cormorant'; font-style:normal; font-weight:500 700; font-display:block; src:url(./fonts/cormorant-normal.woff2) format('woff2'); }
      @font-face { font-family:'Cormorant'; font-style:italic; font-weight:500 700; font-display:block; src:url(./fonts/cormorant-italic.woff2) format('woff2'); }
      @font-face { font-family:'Manrope'; font-style:normal; font-weight:400 700; font-display:block; src:url(./fonts/manrope-normal.woff2) format('woff2'); }
      @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:400 700; font-display:block; src:url(./fonts/jetbrains-mono-normal.woff2) format('woff2'); }

      /* Charte — injectee depuis src/theme/, jamais ecrite a la main (REGLE 4bis). */
      :root {
        --navy:{{C_NAVY}}; --ivory:{{C_IVORY}}; --cream:{{C_CREAM}};
        --slate:{{C_SLATE}}; --cyan:{{C_ACCENT}}; --danger:#c9564b; --warn:#c98f4b;
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:{{W}}px; height:{{H}}px; overflow:hidden; background:{{C_NAVY}}; }
      body { font-family:'Manrope', sans-serif; color:var(--ivory); }

      .fill { position:absolute; inset:0; }
      .scene { position:absolute; inset:0; padding:104px 150px 104px 190px; display:flex;
               flex-direction:column; justify-content:center; }

      .blob { position:absolute; border-radius:50%; display:block; will-change:transform; }
      #blob1 { width:1250px; height:1250px; right:-360px; top:-330px;
               background:radial-gradient(circle, rgba(73,182,201,.20) 0%, rgba(73,182,201,0) 64%); }
      #blob2 { width:1050px; height:1050px; left:-330px; bottom:-380px;
               background:radial-gradient(circle, rgba(73,182,201,.11) 0%, rgba(73,182,201,0) 66%); }
      #grid { position:absolute; inset:-100px; display:block; opacity:.5;
              background-image:repeating-linear-gradient(90deg, rgba(157,177,201,.075) 0 1px, transparent 1px 108px);
              will-change:transform; }
      #scan { position:absolute; left:0; right:0; height:2px; display:block; top:0;
              background:linear-gradient(90deg, rgba(73,182,201,0), rgba(73,182,201,.32), rgba(73,182,201,0)); }

      .rail { position:absolute; left:150px; top:300px; width:2px; height:340px;
              background:linear-gradient(180deg, var(--cyan), rgba(73,182,201,0));
              display:block; transform-origin:top center; }

      .kicker { font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:.32em;
                text-transform:uppercase; color:var(--cyan); display:block; margin-bottom:30px;
                font-style:normal; }
      .num { color:var(--slate); margin-right:22px; }
      .lede { font-family:'Cormorant', serif; font-weight:600; font-size:94px; line-height:1.08;
              letter-spacing:-.015em; color:var(--ivory); display:block; max-width:1420px; }
      .lede.sm { font-size:74px; }
      .lede .l { display:block; overflow:hidden; }
      .lede .l i { display:block; font-style:normal; }
      .sub { font-size:29px; line-height:1.56; color:var(--slate); display:block;
             max-width:1100px; margin-top:32px; }
      .kw { color:var(--cyan); }
      .em { font-family:'Cormorant', serif; font-style:italic; }
      .rule { height:2px; background:var(--cyan); display:block; margin:34px 0;
              width:220px; transform-origin:left center; }

      .cols { display:flex; gap:56px; margin-top:20px; }
      .col { flex:1; border:1px solid rgba(157,177,201,.28); border-radius:6px;
             padding:38px 38px; display:block; }
      .col .tag { font-family:'JetBrains Mono', monospace; font-size:25px; letter-spacing:.2em;
                  display:block; margin-bottom:20px; font-weight:700; }
      .col .body { font-size:26px; line-height:1.55; color:var(--cream); display:block; }
      .m1 { border-color:rgba(201,86,75,.55); } .m1 .tag { color:var(--danger); }
      .m2 { border-color:rgba(73,182,201,.55); } .m2 .tag { color:var(--cyan); }

      .marks { display:flex; flex-wrap:wrap; gap:18px; margin-top:36px; max-width:1440px; }
      .mark { font-family:'JetBrains Mono', monospace; font-size:27px; padding:14px 26px;
              border:1px solid rgba(73,182,201,.45); border-radius:4px; color:var(--cyan); display:block; }

      .gauge { width:1420px; height:26px; border-radius:13px; overflow:hidden; display:flex; margin-top:44px; }
      .gauge span { display:block; height:100%; }
      .g-ok { background:var(--cyan); } .g-warn { background:var(--warn); } .g-bad { background:var(--danger); }
      .glabels { display:flex; width:1420px; margin-top:16px; font-family:'JetBrains Mono', monospace;
                 font-size:20px; letter-spacing:.16em; color:var(--slate); }
      .glabels span { display:block; }
      .cursor { position:absolute; width:3px; height:44px; background:var(--ivory); display:block;
                left:150px; margin-top:-9px; }

      /* ---- Bloc photo -------------------------------------------------
         Une photo n'est pas un bloc « dans » une scene de texte : elle EST la
         scene. Elle occupe tout le cadre, le texte se pose dessus.

         object-fit:cover et JAMAIS fill : la RÈGLE 5bis interdit d'etirer
         l'image pour remplir. On recadre, on ne deforme pas. Le voile en
         degrade rend le texte lisible sans assombrir le sujet : sur une photo
         clinique, ecraser la luminosite ferait perdre ce qu'on montre. */
      .ph-wrap { position:absolute; inset:0; overflow:hidden; display:block; z-index:0; }
      .ph { width:100%; height:100%; object-fit:cover; display:block;
            transform-origin:50% 50%; will-change:transform; }
      .ph.fit { object-fit:contain; }
      .ph-flou { position:absolute; inset:0; width:100%; height:100%;
                 object-fit:cover; filter:blur(48px) brightness(.34) saturate(1.1);
                 display:block; z-index:-1; }
      .ph-voile { position:absolute; inset:0; display:block; z-index:1;
                  background:linear-gradient(180deg,
                    rgba(6,13,24,.72) 0%, rgba(6,13,24,0) 26%,
                    rgba(6,13,24,0) 46%, rgba(6,13,24,.88) 88%); }

      /* Carte de legende — vocabulaire d'ombres de la RÈGLE 4ter : une ombre
         noire large qui decolle du fond, plus une lueur cyan faible (.12) qui
         raccroche a la charte. Sans la seconde la carte parait collee ; trop
         forte, elle vire au neon. */
      .ph-carte { position:absolute; left:150px; right:150px; bottom:150px;
                  z-index:2; display:block; padding:38px 44px; border-radius:18px;
                  background:rgba(2,7,13,.86);
                  border:1px solid rgba(143,163,184,.28);
                  box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 60px rgba(73,182,201,.12); }
      .ph-carte .tag { font-family:'JetBrains Mono', monospace; font-size:22px;
                       letter-spacing:.3em; text-transform:uppercase; color:var(--cyan);
                       display:block; margin-bottom:18px; font-weight:700; }
      .ph-carte .txt { font-family:'Manrope', sans-serif; font-size:40px; font-weight:600;
                       line-height:1.28; color:var(--ivory); display:block;
                       text-shadow:0 3px 20px rgba(0,0,0,.9); }

      .steps { display:flex; gap:28px; margin-top:40px; }
      .step { flex:1; border-top:2px solid var(--cyan); padding-top:24px; display:block;
              transform-origin:left top; }
      .step .t { font-family:'JetBrains Mono', monospace; font-size:21px; color:var(--cyan);
                 display:block; margin-bottom:13px; letter-spacing:.16em; font-weight:700; }
      .step .d { font-size:24px; line-height:1.48; color:var(--cream); display:block; }

      .score { display:flex; align-items:baseline; gap:26px; margin-top:36px; }
      .score .n { font-family:'Cormorant', serif; font-weight:700; font-size:180px;
                  line-height:.9; color:var(--cyan); display:block; }
      .score .u { font-size:29px; color:var(--slate); display:block; }

      .duo { display:flex; gap:70px; margin-top:38px; }
      .card { flex:1; border:1px solid rgba(157,177,201,.28); border-radius:6px; padding:36px 36px; display:block; }
      .card .h { font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:.2em;
                 color:var(--slate); display:block; margin-bottom:18px; }
      .card .v { font-family:'Cormorant', serif; font-size:56px; font-weight:700; display:block; }
      .card .d { font-size:23px; color:var(--slate); display:block; margin-top:14px; line-height:1.45; }
      .bad .v { color:var(--danger); } .ok .v { color:var(--cyan); }

      .lines { display:block; margin-top:8px; }
      .line { font-family:'Cormorant', serif; font-size:60px; font-weight:500; line-height:1.34;
              color:var(--cream); display:block; }
      .sig { font-family:'JetBrains Mono', monospace; font-size:23px; letter-spacing:.3em;
             color:var(--cyan); display:block; margin-top:44px; text-transform:uppercase; font-weight:700; }

      .foot { position:absolute; left:150px; bottom:64px; font-family:'JetBrains Mono', monospace;
              font-size:18px; letter-spacing:.24em; color:var(--slate);
              text-transform:uppercase; display:block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUREE}}"
         data-width="{{W}}" data-height="{{H}}">

      <div id="bg" class="clip fill" data-start="0" data-duration="{{DUREE}}" data-track-index="0"
           style="background:{{C_NAVY}}"></div>
      <div id="grid" class="clip" data-start="0" data-duration="{{DUREE}}" data-track-index="1"></div>
      <div id="blob1" class="clip blob" data-start="0" data-duration="{{DUREE}}" data-track-index="2"></div>
      <div id="blob2" class="clip blob" data-start="0" data-duration="{{DUREE}}" data-track-index="3"></div>
      <div id="scan" class="clip" data-start="0" data-duration="{{DUREE}}" data-track-index="4"></div>

{{SCENES}}

      <div id="foot" class="clip foot" data-start="0" data-duration="{{DUREE}}" data-track-index="6">
        {{FOOT}}
      </div>
{{AUDIO}}
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = {{DUREE}};
      const E = "power3.out";

      tl.fromTo("#blob1", { x: 0, y: 0 }, { x: -170, y: 110, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob2", { x: 0, y: 0 }, { x: 150, y: -90, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo("#grid", { x: 0 }, { x: -216, duration: D, ease: "none" }, 0);
      tl.fromTo("#scan", { y: -40, opacity: 0 }, { y: 1120, opacity: 1, duration: D / 2, ease: "none", repeat: 1 }, 0);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 1, ease: E }, 0.8);
{{AUDIO_TL}}
      /* Entree standard d'une scene : rail, kicker, lignes du titre, filet, sous-titre. */
      function scene(at, id, o) {
        o = o || {};
        tl.fromTo("#" + id + "k", { scaleY: 0, opacity: 0 },
          { scaleY: 1, opacity: 1, duration: 0.75, ease: E }, at);
        tl.fromTo("#" + id + " .kicker", { opacity: 0, x: -22 },
          { opacity: 1, x: 0, duration: 0.5, ease: E }, at + 0.1);
        if (o.lede !== false) {
          tl.fromTo("#" + id + "a .l i", { yPercent: 108 },
            { yPercent: 0, duration: 0.72, stagger: 0.11, ease: "power4.out" }, at + 0.26);
        }
        if (o.rule) {
          tl.fromTo("#" + id + "r", { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: E }, at + 0.72);
        }
        if (o.sub !== false) {
          tl.fromTo("#" + id + "b", { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.6, ease: E }, at + (o.subAt || 0.9));
        }
      }

      /* Compteur seek-safe : la valeur derive de la progression du tween. */
      function compteur(sel, to, at, dur) {
        const o = { v: 0 };
        tl.to(o, {
          v: to, duration: dur, ease: "power2.out",
          onUpdate: function () { document.querySelector(sel).textContent = Math.round(o.v); },
        }, at);
      }

{{TIMELINE}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
